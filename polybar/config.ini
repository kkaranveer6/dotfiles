; ~/.config/polybar/config.ini
; Colors sourced from pywal via Xresources (fallbacks if xrdb not loaded)

[colors]
background = ${xrdb:i3wm.color0:#1C1C23}
foreground = ${xrdb:i3wm.color7:#FFFFFF}
primary    = ${xrdb:i3wm.color2:#008000}
alert      = ${xrdb:i3wm.color1:#FF0000}
disabled   = #555555

[bar/main]
; MONITOR is set by launch.sh — one bar per screen
monitor = ${env:MONITOR:}

width    = 98.8%
height   = 24pt
offset-x = 0.8%
offset-y = 1.3%
radius   = 10

background = ${colors.background}
foreground = ${colors.foreground}
line-size  = 2pt

padding-left  = 1
padding-right = 1
module-margin = 1

separator            = " | "
separator-foreground = ${colors.disabled}

; Font names verified via fc-list
font-0 = JetBrainsMonoNL Nerd Font Propo:style=Medium Italic:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Symbols Nerd Font Mono:size=10;2

modules-left   = date
modules-center = i3
modules-right  = pulseaudio memory cpu network powermenu

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true
tray-position = none

[module/i3]
type = internal/i3

; Show only workspaces assigned to this bar's monitor
pin-workspaces = true

label-focused            = %index%
label-focused-background = ${colors.primary}
label-focused-padding    = 2

label-unfocused         = %index%
label-unfocused-padding = 2

label-visible            = %index%
label-visible-background = ${colors.primary}
label-visible-padding    = 2

label-urgent            = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding    = 2

[module/date]
type     = internal/date
interval = 5

date     = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label            = %date%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix            = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume                   = <label-volume>

label-volume = %percentage%%

label-muted            = MUTE
label-muted-foreground = ${colors.disabled}

[module/memory]
type     = internal/memory
interval = 2

format-prefix            = "MEM "
format-prefix-foreground = ${colors.primary}

label = %percentage_used:2%%

[module/cpu]
type     = internal/cpu
interval = 2

format-prefix            = "CPU "
format-prefix-foreground = ${colors.primary}

label = %percentage:2%%

[module/network]
type           = internal/network
interface-type = wireless
interval       = 5

; Show WiFi icon only — no SSID name
format-connected              = <label-connected>
label-connected               = "WIFI"
label-connected-foreground    = ${colors.primary}

format-disconnected           = <label-disconnected>
label-disconnected            = "NO WIFI"
label-disconnected-foreground = ${colors.disabled}

[module/powermenu]
type = custom/menu

expand-right   = true
format-spacing = 1

label-open            = "PWR"
label-open-foreground = ${colors.alert}

label-close            = "cancel"
label-close-foreground = ${colors.alert}

label-separator            = "|"
label-separator-foreground = ${colors.disabled}

menu-0-0      = reboot
menu-0-0-exec = menu-open-1
menu-0-1      = power off
menu-0-1-exec = menu-open-2

menu-1-0      = cancel
menu-1-0-exec = menu-open-0
menu-1-1      = reboot
menu-1-1-exec = systemctl reboot

menu-2-0      = power off
menu-2-0-exec = systemctl poweroff
menu-2-1      = cancel
menu-2-1-exec = menu-open-0
