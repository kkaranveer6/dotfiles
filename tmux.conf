unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

set -g prefix C-e

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind - split-window -v

set-option -g status-position top

set -g renumber-windows on

set -g mouse on

# --- appearance (minimal) ---

set -g status-style 'bg=default fg=#5c6370'
set -g status-left ''
set -g status-right '#[fg=#5c6370]#(~/.claude/scripts/tmux-claude-usage.sh) '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style 'fg=#61afef'
setw -g window-status-separator ''

set -g pane-border-style 'fg=#3b3f4c'
set -g pane-active-border-style 'fg=#5c6370'

set -g message-style 'bg=default fg=#61afef'
set -g display-panes-colour '#5c6370'
set -g display-panes-active-colour '#61afef'

